services:

  # ── H2 TCP Server ────────────────────────────────────────────────────────────
  h2-server:
    image: oscarfonts/h2:latest
    container_name: gymbarofit-h2
    ports:
      - "9092:9092"   # H2 TCP server
      - "8082:8082"   # H2 web console
    environment:
      H2_OPTIONS: -tcp -tcpAllowOthers -tcpPort 9092 -web -webAllowOthers -webPort 8082 -ifNotExists
    volumes:
      - h2-data:/opt/h2-data
    restart: unless-stopped

  # ── Spring Boot Backend ───────────────────────────────────────────────────────
  backend:
    build:
      context: ./springboot
      dockerfile: Dockerfile
    container_name: gymbarofit-backend
    ports:
      - "8080:8080"
    env_file:
      - ./springboot/.env
    environment:
      SPRING_PROFILES_ACTIVE: docker
      H2_DB_URL: jdbc:h2:tcp://h2-server:9092//opt/h2-data/gymbarofit
    volumes:
      - backend-images:/app/images
    depends_on:
      h2-server:
        condition: service_started
    restart: unless-stopped

  # ── React + Vite Frontend ─────────────────────────────────────────────────────
  frontend:
    build:
      context: ./react-vite
      dockerfile: Dockerfile
    container_name: gymbarofit-frontend
    ports:
      - "5173:5173"
    env_file:
      - ./react-vite/.env
    volumes:
      - ./react-vite/src:/app/src
      - ./react-vite/public:/app/public
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  h2-data:
  backend-images:
