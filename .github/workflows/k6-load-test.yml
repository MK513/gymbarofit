name: K6 Performance Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1: Smoke Test — PR마다 실행 (빠른 피드백)
  # ─────────────────────────────────────────────────────────────────────────────
  smoke:
    name: Smoke Test
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant gradlew permission
        working-directory: springboot
        run: chmod +x gradlew

      - name: Build Spring Boot (skip tests)
        working-directory: springboot
        run: ./gradlew :api:bootJar -x test

      - name: Start backend (CI profile + k6 seed data)
        working-directory: springboot
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET_TEST }}
          K6_SEED_PATH: ${{ github.workspace }}/k6/seed/seed.sql
        run: |
          java -jar api/build/libs/api-*.jar \
            --spring.profiles.active=ci \
            --server.port=8080 &
          echo $! > /tmp/backend.pid

      - name: Wait for backend health
        run: |
          for i in $(seq 1 40); do
            if curl -sf http://localhost:8080/actuator/health > /dev/null 2>&1; then
              echo "Backend is up (${i}x2s elapsed)"
              exit 0
            fi
            echo "Waiting... ($i/40)"
            sleep 2
          done
          echo "Backend failed to start"
          exit 1

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      - name: Run smoke test
        env:
          BASE_URL: http://localhost:8080
          TEST_PASSWORD: ${{ secrets.K6_TEST_PASSWORD }}
        run: |
          mkdir -p k6/results
          k6 run \
            --env CI=true \
            --env BASE_URL=$BASE_URL \
            --env TEST_PASSWORD=$TEST_PASSWORD \
            --out json=k6/results/smoke.json \
            k6/scenarios/smoke.js

      - name: Upload smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-smoke-${{ github.run_number }}
          path: k6/results/smoke.json
          retention-days: 30

      - name: Stop backend
        if: always()
        run: kill $(cat /tmp/backend.pid) 2>/dev/null || true

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: Concurrency Test — main 병합 또는 수동 실행 시에만
  #   동시성 제어(분산 락, 비관적 락) 검증
  #   신선한 DB로 시작 → 이전 smoke 상태 오염 없음
  # ─────────────────────────────────────────────────────────────────────────────
  concurrency:
    name: Concurrency Test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant gradlew permission
        working-directory: springboot
        run: chmod +x gradlew

      - name: Build Spring Boot (skip tests)
        working-directory: springboot
        run: ./gradlew :api:bootJar -x test

      - name: Start backend (CI profile + k6 seed data)
        working-directory: springboot
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET_TEST }}
          K6_SEED_PATH: ${{ github.workspace }}/k6/seed/seed.sql
        run: |
          java -jar api/build/libs/api-*.jar \
            --spring.profiles.active=ci \
            --server.port=8080 &
          echo $! > /tmp/backend.pid

      - name: Wait for backend health
        run: |
          for i in $(seq 1 40); do
            if curl -sf http://localhost:8080/actuator/health > /dev/null 2>&1; then
              echo "Backend is up (${i}x2s elapsed)"
              exit 0
            fi
            echo "Waiting... ($i/40)"
            sleep 2
          done
          echo "Backend failed to start"
          exit 1

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      - name: Run concurrency test
        env:
          BASE_URL: http://localhost:8080
          TEST_PASSWORD: ${{ secrets.K6_TEST_PASSWORD }}
        run: |
          mkdir -p k6/results
          k6 run \
            --env CI=true \
            --env BASE_URL=$BASE_URL \
            --env TEST_PASSWORD=$TEST_PASSWORD \
            --out json=k6/results/concurrency.json \
            k6/scenarios/concurrency.js

      - name: Verify concurrency invariants
        if: always()
        run: |
          echo "=== Concurrency Test Summary ==="
          if [ -f k6/results/concurrency.json ]; then
            SERVER_ERRORS=$(grep -o '"server_errors":{[^}]*"value":[0-9]*' k6/results/concurrency.json \
              | grep -o '"value":[0-9]*' | grep -o '[0-9]*' | tail -1 || echo "N/A")
            echo "Server errors (5xx): ${SERVER_ERRORS}"
            if [ "${SERVER_ERRORS}" != "0" ] && [ "${SERVER_ERRORS}" != "N/A" ]; then
              echo "WARN: Unexpected server errors detected"
            fi
          else
            echo "Result file not found"
          fi

      - name: Upload concurrency results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-concurrency-${{ github.run_number }}
          path: k6/results/concurrency.json
          retention-days: 30

      - name: Stop backend
        if: always()
        run: kill $(cat /tmp/backend.pid) 2>/dev/null || true
