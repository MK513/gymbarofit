x-k6-base: &k6-base
  image: grafana/k6:latest
  volumes:
    - ./k6:/scripts
  env_file:
    - ./k6/.env
  environment:
    BASE_URL: ${BASE_URL:-http://host.docker.internal:8080}
    K6_ADDRESS: 0.0.0.0:6464
  extra_hosts:
    - "host.docker.internal:host-gateway"
  networks:
    - monitoring
  depends_on:
    - influxdb
  profiles:
    - k6

services:

  # ── Backend 오버라이드 — k6/seed/seed.sql 마운트 ───────────────────────────────
  backend:
    volumes:
      - ./k6/seed/seed.sql:/app/k6-seed.sql:ro
    environment:
      SPRING_SQL_INIT_DATA_LOCATIONS: >-
        classpath:data-dev.sql,
        classpath:data-dev-sample.sql,
        file:/app/k6-seed.sql

  # ── InfluxDB 1.8 — K6 메트릭 수신 ────────────────────────────────────────────
  influxdb:
    image: influxdb:1.8
    container_name: gymbarofit-influxdb
    ports:
      - "8086:8086"
    environment:
      INFLUXDB_DB: k6
      INFLUXDB_HTTP_AUTH_ENABLED: "false"
    volumes:
      - influxdb-data:/var/lib/influxdb
    networks:
      - monitoring
    restart: unless-stopped

  # ── Prometheus — Spring Boot Actuator 스크래핑 ────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: gymbarofit-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./k6/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - monitoring
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # ── Grafana — 통합 대시보드 ────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: gymbarofit-grafana
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_FEATURE_TOGGLES_INFLUXDBBACKENDMIGRATION: "false"
    volumes:
      - ./k6/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    networks:
      - monitoring
    depends_on:
      - influxdb
      - prometheus
    restart: unless-stopped

  # ── K6 시나리오 (profiles: k6) ───────────────────────────────────────────────
  k6-smoke:
    <<: *k6-base
    command: run --out influxdb=http://influxdb:8086/k6 --tag testid=smoke /scripts/scenarios/smoke.js

  k6-load:
    <<: *k6-base
    command: run --out influxdb=http://influxdb:8086/k6 --tag testid=load /scripts/scenarios/load.js

  k6-stress:
    <<: *k6-base
    command: run --out influxdb=http://influxdb:8086/k6 --tag testid=stress /scripts/scenarios/stress.js

  k6-soak:
    <<: *k6-base
    command: run --out influxdb=http://influxdb:8086/k6 --tag testid=soak /scripts/scenarios/soak.js

  k6-concurrency:
    <<: *k6-base
    command: run --out influxdb=http://influxdb:8086/k6 --tag testid=concurrency /scripts/scenarios/concurrency.js

networks:
  monitoring:
    driver: bridge

volumes:
  influxdb-data:
  grafana-data:
