spring:
  jpa:
    hibernate:
      ddl-auto: create
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
      data-locations: classpath:data-dev.sql,classpath:data-dev-sample.sql
  datasource:
    url: ${H2_DB_URL}
    username: ${H2_DB_USERNAME}
    password: ${H2_DB_PASSWORD}
    driver-class-name: org.h2.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# 디버그 모드 활성화
logging.level:
  org.hibernate.SQL: debug
  org.springframework.security: DEBUG

app:
  ai:
    fastapi:
      base-url: ${FASTAPI_BASE_URL}
  upload:
    dir: C:/Users/finem/Desktop/gymbarofit/springboot/images
  jwt:
    refresh-token:
      secure-cookie: false # localhost는 HTTPS 미사용