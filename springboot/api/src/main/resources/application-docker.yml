spring:
  jpa:
    hibernate:
      ddl-auto: create
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
      data-locations:
        - classpath:data-dev.sql
        - classpath:data-dev-sample.sql
        - classpath:data-k6-seed.sql
  datasource:
    url: ${H2_DB_URL}
    username: ${H2_DB_USERNAME}
    password: ${H2_DB_PASSWORD}
    driver-class-name: org.h2.Driver

