worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Docker 내장 DNS — 동적 replica IP 해석 (nginx 기동 후 추가된 replica도 인식)
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream backend-pool {
        least_conn;
        server backend:8080;
        keepalive 32;
    }

    log_format main '$remote_addr [$time_local] "$request" $status '
                    'upstream=$upstream_addr';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # 공통 proxy 헤더
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # HTTP/1.1 keepalive to upstream
    proxy_http_version 1.1;
    proxy_set_header   Connection "";

    # 일반 타임아웃
    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    server {
        listen 80;
        server_name _;

        # ── SSE 전용 경로 (/sse/subscribe) ──────────────────────────────────
        # SseEmitter timeout = 30분(1800s) — proxy_read_timeout이 같거나 커야 함
        # Redis Pub/Sub 구현으로 sticky session 불필요
        location /sse {
            proxy_pass         http://backend-pool;

            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 1800s;

            # 중간 CDN/가속기에도 버퍼링 비활성화 전달
            proxy_set_header X-Accel-Buffering no;

            proxy_set_header Connection "";
            proxy_http_version 1.1;
        }

        # ── 나머지 모든 API 요청 ────────────────────────────────────────────
        location / {
            proxy_pass http://backend-pool;
        }
    }
}
